<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081321">
<title>GRAVITY GLOW — ひかりを とどけよう</title>
<style>
:root{--bg:#081321;--ink:#eef8ff;--muted:#9aafc2;--cyan:#65eaff;--pink:#ff9bbd;--gold:#ffe0a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse 90% 40% at 50% -13%,#193e58 0%,transparent 75%),var(--bg);color:var(--ink);font-family:ui-rounded,"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",-apple-system,system-ui,sans-serif;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:480px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));min-height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;min-height:40px;gap:8px}
.brand{font-family:ui-rounded,system-ui,sans-serif;letter-spacing:.23em;font-size:12px;font-weight:900;color:#b7e8f2;white-space:nowrap}
.brand i{font-style:normal;color:#79dce4}
.topright{display:flex;align-items:center;gap:8px}
.count{background:#173048;color:#b8e3fa;border:1px solid #29465b;padding:8px 13px;border-radius:999px;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.iconbtn{height:38px;width:38px;border-radius:50%;display:grid;place-items:center;border:1px solid #29465b;background:#112639;transition:transform .17s,background .17s}
.iconbtn:active,.softbtn:active,.bigbtn:active{transform:scale(.94)}
.iconbtn svg{height:17px;width:17px;stroke:#b9d3e1;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.headline{text-align:center;margin:15px 0 12px;min-height:70px}
.headline h1{font-size:clamp(25px,7vw,32px);font-weight:850;letter-spacing:.045em;line-height:1.34;margin:0;color:#f3fcff;text-shadow:0 3px 30px #8ccfff18}
.headline p{font-size:13px;color:#b3c9d5;font-weight:650;letter-spacing:.05em;margin:7px 0 0}
.scene-frame{position:relative;border:1px solid #35536b;background:#071729;border-radius:25px;overflow:hidden;isolation:isolate;box-shadow:0 26px 58px #01060fa6,0 0 0 5px #0e233747, inset 0 0 55px #132942}
.scene{display:block;width:100%;height:auto;aspect-ratio:360/430;touch-action:none;user-select:none;-webkit-user-select:none}
.game-footer{padding:14px 3px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.status{min-width:0;display:flex;align-items:center;gap:10px;color:#bdd0df;font-size:13px;font-weight:750;letter-spacing:.015em}
.spark{height:11px;width:11px;border-radius:50%;background:#9bafff;box-shadow:0 0 16px #8399ff80}
.tools{display:flex;gap:8px;flex-shrink:0}
.softbtn{border:1px solid #2b4357;background:#102637;border-radius:999px;color:#b8d2e1;padding:11px 13px;font-size:12px;font-weight:750;transition:transform .17s,background .17s}
.softbtn:first-letter{font-size:14px}
.progress{display:flex;justify-content:center;gap:5px;margin:19px auto 0}
.pip{width:17px;height:4px;background:#284356;border-radius:999px;transition:background .2s, width .2s}
.pip.done{background:#6cd2db}.pip.now{background:#c6edf6;width:27px}
.below{text-align:center;font-size:10px;color:#68899d;letter-spacing:.055em;margin-top:13px}
#sceneSvg text{font-family:ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif}
.drag-target{cursor:grab;touch-action:none}.drag-target:active{cursor:grabbing}
.orb-breath{animation:orbreathe 2.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.target-pulse{animation:pulse 2.15s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes orbreathe{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.91)}50%{opacity:1;transform:scale(1.12)}}
#gesture{pointer-events:none;animation:gesture 2.4s cubic-bezier(.45,0,.2,1) infinite}
@keyframes gesture{0%,12%{opacity:0;transform:translateY(15px)}25%{opacity:1}70%{opacity:1;transform:translateY(-24px)}91%,100%{opacity:0;transform:translateY(-30px)}}
#hint-layer{pointer-events:none}
.success-screen{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(180deg,#07192870,#071928e6 72%);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;backdrop-filter:blur(2px)}
.success-screen.show{opacity:1;visibility:visible}
.success-icon{font-size:51px;filter:drop-shadow(0 0 21px #ffe6a5bb);animation:pop .55s cubic-bezier(.16,1.5,.4,1) both}
.success-title{font-size:40px;font-weight:900;color:#fff8de;letter-spacing:.08em;margin:10px 0 2px;text-shadow:0 0 36px #ffe7bd60}
.success-sub{font-size:14px;font-weight:700;color:#cbe4ed;letter-spacing:.04em;margin-bottom:27px}
.bigbtn{background:linear-gradient(130deg,#83f1fa,#b0fbeb);border:0;color:#073044;border-radius:999px;min-width:210px;padding:16px 20px;font-weight:900;font-size:15px;box-shadow:0 7px 36px #54cde466;transition:transform .17s}
@keyframes pop{from{transform:scale(.4) rotate(-18deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.floating{position:absolute;z-index:11;pointer-events:none;font-size:16px;animation:floatup 1s ease-out forwards}
@keyframes floatup{0%{opacity:1;transform:translate(0,0) scale(.65)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.5)}}
.toast{pointer-events:none;position:absolute;z-index:8;bottom:16px;left:50%;transform:translate(-50%,10px);font-size:12px;font-weight:850;color:#e9fdff;background:#1c394acb;border:1px solid #5d9aae7d;border-radius:999px;padding:9px 15px;white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.stage-sheet{position:fixed;inset:0;display:none;z-index:40;background:#04111cbb;backdrop-filter:blur(7px);align-items:center;justify-content:center;padding:18px}
.stage-sheet.open{display:flex}
.sheet-inner{background:#102538;border:1px solid #43657b;border-radius:25px;padding:21px;width:min(400px,100%);box-shadow:0 20px 70px #000b}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}
.sheet-top h2{font-size:21px;margin:0;letter-spacing:.03em}
.level-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.level-grid button{height:55px;border-radius:15px;background:#17354a;border:1px solid #36586b;font-size:15px;font-weight:850;color:#bfe7f0}
.level-grid button.active{background:#b5f7ee;color:#0d3547;border-color:#c2fff0}
.sheet-note{margin-top:15px;color:#8faebf;font-size:11px;line-height:1.6}
@media(max-height:760px){.app{padding-top:calc(7px + env(safe-area-inset-top))}.headline{margin:7px 0 9px;min-height:56px}.headline h1{font-size:26px}.headline p{margin-top:3px}.game-footer{padding-top:10px}.progress{margin-top:12px}.below{margin-top:8px}}
@media(max-width:370px){.headline h1{font-size:26px}.headline p{font-size:12px}.tools{gap:5px}.softbtn{padding:9px 10px}.game-footer{gap:3px}.status{font-size:11px}}
@media(prefers-reduced-motion:reduce){.orb-breath,.target-pulse,#gesture{animation:none}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">GRAVITY <i>✦</i> GLOW</div>
    <div class="topright">
      <button class="count" id="stage-menu" aria-label="ステージを選ぶ">01 / 12 ▾</button>
      <button class="iconbtn" id="sound" aria-label="音を切り替える" title="音のオン・オフ">
        <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path id="sound-wave" d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg>
      </button>
    </div>
  </header>
  <div class="headline">
    <h1 id="headline">ほしを うごかそう</h1>
    <p id="subhead">ひかりを ゴールに とどけよう</p>
  </div>
  <section class="scene-frame" id="scene-frame" aria-label="星を動かして光をゴールへ届けるゲーム">
    <svg class="scene" id="sceneSvg" viewBox="0 0 360 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="星をドラッグして、光を右側の輪に入れよう">
      <defs>
        <radialGradient id="space" cx="49%" cy="42%" r="69%"><stop stop-color="#112c43"/><stop offset=".68" stop-color="#0a1b30"/><stop offset="1" stop-color="#071322"/></radialGradient>
        <radialGradient id="planet-glow"><stop stop-color="#aa91ff" stop-opacity=".30"/><stop offset=".32" stop-color="#9881ed" stop-opacity=".14"/><stop offset="1" stop-color="#947be8" stop-opacity="0"/></radialGradient>
        <radialGradient id="planet-core" cx="34%" cy="26%"><stop stop-color="#fffdff"/><stop offset=".15" stop-color="#e1caff"/><stop offset=".52" stop-color="#a18afa"/><stop offset="1" stop-color="#5346a1"/></radialGradient>
        <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3faff" stop-opacity=".85"/><stop offset="1" stop-color="#e9d5ff" stop-opacity="0"/></linearGradient>
        <filter id="blur"><feGaussianBlur stdDeviation="3.3"/></filter>
        <filter id="wideblur"><feGaussianBlur stdDeviation="7.5"/></filter>
        <clipPath id="clip-space"><rect x="0" y="0" width="360" height="430" rx="0"/></clipPath>
      </defs>
      <rect width="360" height="430" fill="url(#space)"/>
      <g id="dust"></g>
      <g id="warp" opacity=".82" clip-path="url(#clip-space)"></g>
      <g id="lightpaths" clip-path="url(#clip-space)"></g>
      <g id="emitters"></g>
      <g id="receivers"></g>
      <g id="planets"></g>
      <g id="hint-layer"></g>
      <g id="gesture"></g>
    </svg>
    <div class="success-screen" id="success-screen">
      <div class="success-icon">✦</div>
      <div class="success-title">ぴったり！</div>
      <div class="success-sub" id="success-sub">ひかりが とどいた！</div>
      <button class="bigbtn" id="next">つぎへ すすむ　→</button>
    </div>
    <div class="toast" id="toast">このあたりに うごかしてみよう ✦</div>
  </section>
  <div class="game-footer">
    <div class="status"><span class="spark" id="spark"></span><span id="status">ほしを ゆびで うごかそう</span></div>
    <div class="tools">
      <button class="softbtn" id="hint">✧ ヒント</button>
      <button class="softbtn" id="reset">↺ もういちど</button>
    </div>
  </div>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <div class="below">ひかりは ほしの ちかくで まがる</div>
</main>
<div class="stage-sheet" id="stage-sheet" role="dialog" aria-modal="true" aria-label="ステージを選ぶ">
 <div class="sheet-inner"><div class="sheet-top"><h2>ステージを えらぼう</h2><button class="iconbtn" id="close-sheet" aria-label="閉じる">✕</button></div><div class="level-grid" id="level-grid"></div><div class="sheet-note">どのステージからでも おためしできます。<br>最初は 01 からがおすすめ。</div></div>
</div>
<script>
'use strict';
// 物理の厳密な一般相対論シミュレーションではなく、弱い重力による光線偏向を誇張した遊戯用モデル。
// 星の横方向・縦方向への移動が、光線を連続的に変えることを重視。
const LEVELS=[
 {s:[210],sol:[[165,150]],start:[[166,323]],title:'ほしを うごかそう',sub:'ひかりを ゴールに とどけよう'},
 {s:[150],sol:[[195,195]],start:[[190,70]],title:'こんどは したへ',sub:'ほしを うごかして ひかりを まげよう'},
 {s:[274],sol:[[183,218]],start:[[180,340]],title:'ぐいーんと まげよう',sub:'ひかりの みちを かえよう'},
 {s:[120],sol:[[160,185]],start:[[175,315]],title:'もう できるかな？',sub:'ほしを うごかして ゴールを ねらおう'},
 {s:[210],sol:[[240,145]],start:[[125,300]],title:'よこにも うごかそう',sub:'ほしは どこに おいたら いい？'},
 {s:[115,285],sol:[[175,205]],start:[[170,355]],title:'ひかりが 2ほん！',sub:'どちらも ゴールに とどけよう'},
 {s:[140,255],sol:[[182,290]],start:[[108,350]],title:'2ほんを いっしょに',sub:'1この ほしで 2ほんを まげよう'},
 {s:[150,270],sol:[[140,115],[235,245]],start:[[145,365],[235,65]],title:'ほしが 2こ！',sub:'2この ほしを うごかそう'},
 {s:[120,300],sol:[[130,160],[245,310]],start:[[155,337],[245,80]],title:'ひかりの みちを つくろう',sub:'2この ほしを じょうずに つかおう'},
 {s:[112,208,307],sol:[[196,275],[139,247]],start:[[145,330],[235,65]],title:'ひかりが 3ぼん！',sub:'3ぼん ぜんぶを ゴールへ'},
 {s:[98,190,292],sol:[[130,240],[250,310]],start:[[180,340],[230,75]],title:'むずかしいぞ！',sub:'どの ほしから うごかす？'},
 {s:[122,218,310],sol:[[110,170],[186,85],[257,258]],start:[[105,355],[180,348],[255,65]],title:'ほしの マスター',sub:'すべての ひかりを とどけよう'}
];
const COLORS=['#6ae9ff','#ff9fbd','#ffdca0'];
const $=q=>document.querySelector(q), svgEl=(tag,attrs={},parent)=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);parent?.appendChild(n);return n};
let level=0,stars=[],paths=[],prevTargets=[],goalY=[],drag=-1,dragId=null,dirty=true,cleared=false,hasTouched=false,hintVisible=false,gameTime=0,wasNear=false,soundOn=true,toastTimer=null,hintTimer=null,successTimer=null;
let audio;
const el={warp:$('#warp'),dust:$('#dust'),light:$('#lightpaths'),emit:$('#emitters'),recv:$('#receivers'),planets:$('#planets'),hint:$('#hint-layer'),gesture:$('#gesture'),status:$('#status'),progress:$('#progress'),headline:$('#headline'),subhead:$('#subhead'),spark:$('#spark'),success:$('#success-screen')};
function tone(freq,delay=0,duration=.17,volume=.042){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let now=audio.currentTime+delay;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(volume,now+.014);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+duration+.01)}catch(e){}}
function tapSound(){tone(550,0,.09,.019)}
function winSound(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.105,.42,.046))}
function seeded(i){let x=Math.sin(i*127.1+31.81)*43758.5453;return x-Math.floor(x)}
function makeDust(){el.dust.replaceChildren();for(let i=0;i<78;i++){let x=11+seeded(i*4+1)*338,y=10+seeded(i*4+2)*410;svgEl('circle',{cx:x,cy:y,r:(.45+seeded(i*7+4)*1.1).toFixed(2),fill:'#acd7f0',opacity:(.11+seeded(i*4+3)*.31).toFixed(2)},el.dust)}}
makeDust();
function trace(y0,pts){let x=28,y=y0,slope=0,poly=[[x,y]];const step=3;for(;x<334;){const ds=Math.min(step,334-x);for(const p of pts){const dx=p.x-x,dy=p.y-y,r2=dx*dx+dy*dy+625;slope+=ds*13*dy/Math.pow(r2,1.5)}slope=Math.max(-2.3,Math.min(2.3,slope));y+=slope*ds;x+=ds;poly.push([x,y])}return{poly,end:y}}
function curvePath(points){return points.map(([x,y],i)=>`${i?'L':'M'}${x.toFixed(2)} ${y.toFixed(2)}`).join(' ')}
function generateWarp(){el.warp.replaceChildren();for(let x=0;x<=360;x+=27){let pts=[];for(let y=0;y<=430;y+=10)pts.push(warpPoint(x,y));svgEl('path',{d:curvePath(pts),fill:'none',stroke:'#92c1e1','stroke-width':'.72',opacity:'.19'},el.warp)}for(let y=0;y<=430;y+=27){let pts=[];for(let x=0;x<=360;x+=10)pts.push(warpPoint(x,y));svgEl('path',{d:curvePath(pts),fill:'none',stroke:'#92c1e1','stroke-width':'.72',opacity:'.19'},el.warp)}
 for(const st of stars){svgEl('circle',{cx:st.x,cy:st.y,r:51,fill:'none',stroke:'#c3a4ff','stroke-width':'.8','stroke-dasharray':'3 8',opacity:'.20'},el.warp)}}
function warpPoint(x,y){for(const st of stars){let dx=st.x-x,dy=st.y-y,rr=dx*dx+dy*dy,dist=Math.sqrt(rr)+.001;let power=23*Math.exp(-rr/6700);x+=dx/dist*power;y+=dy/dist*power}return[x,y]}
function buildRayLayers(){el.light.replaceChildren();paths=LEVELS[level].s.map((y,i)=>{const group=svgEl('g',{},el.light),color=COLORS[i],glow=svgEl('path',{fill:'none',stroke:color,'stroke-width':11,opacity:.12,filter:'url(#wideblur)'},group),halo=svgEl('path',{fill:'none',stroke:color,'stroke-width':5,opacity:.3,filter:'url(#blur)'},group),core=svgEl('path',{fill:'none',stroke:color,'stroke-width':2.6,opacity:.97,'stroke-linecap':'round'},group),orb=svgEl('circle',{r:4.1,fill:'#fff',stroke:color,'stroke-width':3},group),orbGlow=svgEl('circle',{r:10,fill:color,opacity:.18},group);return{y,group,glow,halo,core,orb,orbGlow,poly:[],end:0}})}
function drawEmitters(){el.emit.replaceChildren();LEVELS[level].s.forEach((y,i)=>{const color=COLORS[i],g=svgEl('g',{},el.emit);svgEl('circle',{cx:28,cy:y,r:22,fill:color,opacity:.08},g);svgEl('circle',{cx:28,cy:y,r:11,fill:'#0e2639',stroke:color,'stroke-width':2.8},g);svgEl('path',{d:`M27 ${y-4}L34 ${y}L27 ${y+4}Z`,fill:color},g)})}
function drawTargets(){el.recv.replaceChildren();prevTargets=[];goalY.forEach((y,i)=>{const color=COLORS[i],g=svgEl('g',{},el.recv);const aura=svgEl('circle',{cx:334,cy:y,r:26,fill:color,opacity:'.06'},g);const pulse=svgEl('circle',{cx:334,cy:y,r:19,fill:'none',stroke:color,'stroke-width':1.1,opacity:.45,class:'target-pulse'},g);const circle=svgEl('circle',{cx:334,cy:y,r:12,fill:'#112638',stroke:color,'stroke-width':3},g);svgEl('circle',{cx:334,cy:y,r:5,fill:color,opacity:.56},g);prevTargets.push({g,circle,aura,pulse,color,hit:false})})}
function drawStars(){el.planets.replaceChildren();stars.forEach((s,i)=>{const g=svgEl('g',{transform:`translate(${s.x} ${s.y})`,class:'drag-target','data-star':i},el.planets);svgEl('circle',{r:59,fill:'url(#planet-glow)'},g);svgEl('circle',{r:28,fill:'none',stroke:'#b7a1ff','stroke-width':'1.7',opacity:.42,'stroke-dasharray':'3 6',class:'orb-breath'},g);svgEl('ellipse',{rx:35,ry:10,transform:'rotate(-24)',fill:'none',stroke:'#ccb6ff','stroke-width':'1.3',opacity:'.67'},g);svgEl('circle',{r:20,fill:'url(#planet-core)',stroke:'#c9baff','stroke-width':'1.2'},g);svgEl('circle',{cx:-7,cy:-7,r:6,fill:'#fff',opacity:.55,filter:'url(#blur)'},g);svgEl('circle',{cx:31,cy:-12,r:2.7,fill:'#d8caff'},g);svgEl('circle',{r:48,fill:'transparent','pointer-events':'all'},g);g.addEventListener('pointerdown',ev=>beginDrag(ev,i));s.node=g})}
function drawGesture(){el.gesture.replaceChildren();if(hasTouched||level>0)return;const s=stars[0];const g=svgEl('g',{transform:`translate(${s.x+39} ${s.y+37})`},el.gesture);svgEl('rect',{x:-39,y:14,width:98,height:29,rx:15,fill:'#e8faff',opacity:'.95'},g);const txt=svgEl('text',{x:10,y:33,'font-size':12,'font-weight':900,'text-anchor':'middle',fill:'#143a50'},g);txt.textContent='ゆびで うごかす';svgEl('path',{d:'M0 2L-6 -5M0 2L6 -5',stroke:'#e8faff','stroke-width':2.5,'stroke-linecap':'round',fill:'none'},g)}
function getGoalYs(){const l=LEVELS[level];return l.s.map(y=>trace(y,l.sol.map(([x,y])=>({x,y}))).end)}
function loadLevel(index){clearTimeout(successTimer);clearTimeout(hintTimer);cleared=false;drag=-1;dragId=null;hintVisible=false;wasNear=false;level=(index+LEVELS.length)%LEVELS.length;const l=LEVELS[level];stars=l.start.map(([x,y])=>({x,y,node:null}));goalY=getGoalYs();el.headline.textContent=l.title;el.subhead.textContent=l.sub;$('#stage-menu').textContent=String(level+1).padStart(2,'0')+' / 12 ▾';el.success.classList.remove('show');$('#next').textContent=level===11?'もういちど あそぶ ↻':'つぎへ すすむ　→';el.status.textContent=level===0?'ほしを ゆびで うごかそう':l.s.length===1?'ひかりを ゴールへ':`${l.s.length}ぼんの ひかりを とどけよう`;el.spark.style.background=COLORS[0];el.spark.style.boxShadow='0 0 16px #65eaff75';el.progress.innerHTML=LEVELS.map((_,i)=>`<span class="pip ${i<level?'done':i===level?'now':''}"></span>`).join('');drawEmitters();drawTargets();buildRayLayers();drawStars();drawGesture();el.hint.replaceChildren();dirty=true;requestRecompute();$('#level-grid').innerHTML=LEVELS.map((_,i)=>`<button class="${level===i?'active':''}" data-go="${i}" aria-label="ステージ${i+1}">${String(i+1).padStart(2,'0')}</button>`).join('');$('#level-grid').querySelectorAll('button').forEach(b=>b.onclick=()=>{closeSheet();tapSound();loadLevel(+b.dataset.go)});}
function requestRecompute(){dirty=true}
function recompute(){dirty=false;generateWarp();let okCount=0;paths.forEach((p,i)=>{const r=trace(p.y,stars);p.poly=r.poly;p.end=r.end;const d=curvePath(r.poly);p.glow.setAttribute('d',d);p.halo.setAttribute('d',d);p.core.setAttribute('d',d);const err=Math.abs(p.end-goalY[i]);const hit=err<=(LEVELS[level].s.length>1?11:10);if(hit)okCount++;prevTargets[i].hit=hit;prevTargets[i].circle.setAttribute('stroke-width',hit?'5':'3');prevTargets[i].circle.setAttribute('fill',hit?COLORS[i]+'35':'#112638');prevTargets[i].aura.setAttribute('opacity',hit?'.23':'.06');prevTargets[i].circle.setAttribute('r',hit?'14':'12')});if(!cleared){if(okCount===paths.length){el.status.textContent='ぴったり！';el.spark.style.background='#b8ffda';if(!wasNear){tone(783.99,0,.12,.025);wasNear=true}if(drag<0){successTimer=setTimeout(()=>{if(!dirty&&!cleared&&paths.every((p,i)=>Math.abs(p.end-goalY[i])<=(paths.length>1?11:10)))doSuccess()},270)}}else{clearTimeout(successTimer);wasNear=false;const remain=paths.length-okCount;el.status.textContent=paths.length===1?'ひかりを ゴールへ':`あと ${remain}ぼん！`;el.spark.style.background=COLORS[Math.max(0,paths.findIndex((p,i)=>!prevTargets[i].hit))]}}}
function animate(ts){gameTime=ts/1000;if(dirty)recompute();paths.forEach((p,i)=>{if(!p.poly.length)return;const cycle=(gameTime/(1.75+i*.19)+i*.27)%1;const t=cycle*(p.poly.length-1);const k=Math.min(p.poly.length-2,Math.floor(t));const a=p.poly[k],b=p.poly[k+1],f=t-k;const x=a[0]+(b[0]-a[0])*f,y=a[1]+(b[1]-a[1])*f;p.orb.setAttribute('cx',x);p.orb.setAttribute('cy',y);p.orbGlow.setAttribute('cx',x);p.orbGlow.setAttribute('cy',y)});requestAnimationFrame(animate)}
function pointerPos(ev){const svg=$('#sceneSvg');const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const ctm=svg.getScreenCTM();if(!ctm)return{x:0,y:0};const pp=pt.matrixTransform(ctm.inverse());return{x:pp.x,y:pp.y}}
function beginDrag(ev,i){if(cleared)return;ev.preventDefault();if(!hasTouched){hasTouched=true;el.gesture.replaceChildren()}drag=i;dragId=ev.pointerId;stars[i].node.parentElement.append(stars[i].node);stars[i].node.setPointerCapture?.(ev.pointerId);tapSound();const p=pointerPos(ev);stars[i].ox=p.x-stars[i].x;stars[i].oy=p.y-stars[i].y;stars[i].node.style.cursor='grabbing'}
function updateDrag(ev){if(drag<0||dragId!==ev.pointerId)return;ev.preventDefault();const p=pointerPos(ev),s=stars[drag];s.x=Math.max(72,Math.min(279,p.x-s.ox));s.y=Math.max(40,Math.min(390,p.y-s.oy));s.node.setAttribute('transform',`translate(${s.x} ${s.y})`);requestRecompute()}
function endDrag(ev){if(drag<0||dragId!==ev.pointerId)return;const s=stars[drag];s.node.style.cursor='grab';drag=-1;dragId=null;recompute();if(paths.every((p,i)=>prevTargets[i].hit)&&!cleared){clearTimeout(successTimer);successTimer=setTimeout(()=>{if(!cleared)doSuccess()},220)}}
$('#sceneSvg').addEventListener('pointermove',updateDrag);$('#sceneSvg').addEventListener('pointerup',endDrag);$('#sceneSvg').addEventListener('pointercancel',endDrag);
function doSuccess(){if(cleared)return;cleared=true;clearTimeout(successTimer);winSound();el.status.textContent='やった！';$('#success-sub').textContent=level===11?'ぜんぶ クリア！ すごい！':`${paths.length}ぼんの ひかりが とどいた！`;el.success.classList.add('show');spawnSparkles();try{const old=Number(localStorage.getItem('gravityGlowMax')||0);if(level+1>old)localStorage.setItem('gravityGlowMax',level+1)}catch(e){}}
function spawnSparkles(){const card=$('#scene-frame');for(let i=0;i<22;i++){const d=document.createElement('span');d.className='floating';d.textContent=i%4===0?'✦':'•';d.style.left=`${20+seeded(i*3+2)*63}%`;d.style.top=`${35+seeded(i*3+3)*33}%`;d.style.color=['#e8feff','#a0f8ff','#ffdbbb','#d8c7ff'][i%4];d.style.setProperty('--tx',`${(seeded(i*5+2)-.5)*150}px`);d.style.setProperty('--ty',`${-30-seeded(i*5+4)*90}px`);d.style.animationDelay=`${i*.025}s`;card.appendChild(d);setTimeout(()=>d.remove(),1250)}}
function hint(){if(cleared)return;tapSound();el.hint.replaceChildren();LEVELS[level].sol.forEach(([x,y],i)=>{const g=svgEl('g',{},el.hint);svgEl('circle',{cx:x,cy:y,r:26,stroke:'#e0d1ff',fill:'#b9a5f7','fill-opacity':'.11','stroke-width':2,'stroke-dasharray':'5 5'},g);svgEl('path',{d:`M${x-9} ${y}H${x+9}M${x} ${y-9}V${y+9}`,stroke:'#d8c4ff','stroke-width':1.6,opacity:.7},g)});showToast('ほしを このあたりへ ✦');clearTimeout(hintTimer);hintTimer=setTimeout(()=>{el.hint.replaceChildren()},2400)}
function showToast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2000)}
function openSheet(){$('#stage-sheet').classList.add('open')}
function closeSheet(){$('#stage-sheet').classList.remove('open')}
$('#stage-menu').onclick=openSheet;$('#close-sheet').onclick=closeSheet;$('#stage-sheet').addEventListener('click',e=>{if(e.target.id==='stage-sheet')closeSheet()});
$('#hint').onclick=hint;$('#reset').onclick=()=>{tapSound();loadLevel(level)};$('#next').onclick=()=>{tapSound();loadLevel(level+1)};
$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound-wave').style.opacity=soundOn?'1':'.16';if(soundOn)tone(659.25,0,.14,.035)};
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='ArrowRight'&&cleared)loadLevel(level+1)});
loadLevel(0);requestAnimationFrame(animate);
</script>
</body></html>
