</style></head><body><main><div class="eyebrow">PHYSICS → PLAYABLE MECHANICS</div><div class="heading">RELATIVITY LAB<span style="color:var(--cyan)">.</span></div><div class="sub">3つの物理ギミックを比較するための小さな実験室。<br>数式の問題集ではなく、実際に触れて感触を確かめる試作。</div><nav class="tabs" aria-label="遊ぶゲームを選択"><button class="tab active" data-mode="world">01 世界線</button><button class="tab" data-mode="causal">02 光円錐</button><button class="tab" data-mode="mirror">03 動く鏡</button></nav><section id="app" class="panel" aria-live="polite"></section><p id="note" class="note"></p><p class="footer">すべてオフラインで動作。速度・時間・光路は物理式で計算（c = 1）。宇宙船の加速・減速は瞬間的に行う理想化。光円錐は信号速度の上限を使用。グラフィックは模式図。</p></main>
<script>
'use strict';
const $=s=>document.querySelector(s), app=$('#app');let mode='world';let audio;
function beep(win=false){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const now=audio.currentTime;let f=win?[523.25,659.25,783.99]:[440];f.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=hz;const at=now+i*(win?.09:0);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.055,at+.018);g.gain.exponentialRampToValueAtTime(.0001,at+(win?.25:.095));o.connect(g);g.connect(audio.destination);o.start(at);o.stop(at+(win?.27:.11))})}catch(e){}}
const sp=[0,6,-6,8,-8];const worldLevels=[
{label:'はじめての時間差',n:2,tau:3.2,x:0,cp:{},desc:'往復して地球に戻ろう。地球では4年、船内では3.2年を過ごす。'},
{label:'途中で立ち止まる',n:3,tau:4.4,x:0,cp:{1:1.6,2:1.6},desc:'2年目と4年目は、同じ場所にいる。6年後に帰還して船内時計を4.4年に。'},
{label:'遠くへ、そして帰る',n:4,tau:5.6,x:0,cp:{2:2.8},desc:'4年目に2.8光年先を通り、8年後に帰還。船内では5.6年。'},
{label:'一度止まって戻る',n:5,tau:7.6,x:0,cp:{2:2.8,4:1.2},desc:'4年目に2.8光年、8年目に1.2光年。10年後の再会時、船内時計は7.6年。'},
{label:'六区間の往復',n:6,tau:9.6,x:0,cp:{2:2.8,4:2.8,5:1.6},desc:'4年目・8年目・10年目の通過点を守り、12年後に帰還しよう。'},
{label:'折り返す二つの山',n:6,tau:8,x:0,cp:{2:3.2,4:0,5:1.2},desc:'4年目に3.2光年、8年目に地球、10年目に1.2光年へ。12年後の船内時計は8年。'}
];let wi=0, wv=[],ws=0, wmsg='区間をタップし、下の速度から選んでみよう。';
const causalLevels=[
{label:'光の速さでつなぐ',desc:'時間が足りない接続はできない。青い点を順番にタップして緑のゴールへ。',nodes:[['S',0,0,0],['A',2,2,1],['D',-3,2,0],['G',4,4,2]],max:3},
{label:'遠くへ曲がる',desc:'黄色い中継点を全て通り、最後にゴールへ。途中を飛び越してはならない。',nodes:[['S',0,0,0],['A',2,2,1],['C',3,4,0],['D',-3,4,0],['B',-1,5,1],['G',1,8,2]],max:4},
{label:'遠回りはできるか',desc:'中継点の場所と時刻は固定。届く範囲を重ねて、すべてをつなごう。',nodes:[['S',0,0,0],['D',-2,3,0],['A',3,4,1],['E',4,7,0],['B',-1,8,1],['F',5,11,0],['C',2,12,1],['G',0,14,2]],max:5},
{label:'光円錐の隙間',desc:'光の届く範囲だけを使って、3つの必須点をつなごう。',nodes:[['S',0,0,0],['A',1,3,1],['D',-3,4,0],['B',-2,7,1],['E',4,8,0],['C',2,11,1],['F',-4,12,0],['G',0,14,2]],max:5}
];let ci=0,path=['S'],cmsg='次に信号を中継する点をタップしよう。';
const mirrorLevels=[
{label:'反射して戻る',desc:'右側の動く鏡に光を当てて戻す。発射から帰還まで「6拍」にしよう。',d:3,v:0,only:'t'},
{label:'色を3倍に',desc:'鏡に向かって光を送り、戻ったときの周波数を3倍にしよう。',d:3,v:-.5,only:'f'},
{label:'赤く、ゆっくり',desc:'戻るまで8拍、周波数は元の3分の1。2条件を同時に満たそう。',d:2,v:.5},
{label:'青く、素早く',desc:'戻るまで4拍、周波数は3倍。2条件を同時に満たそう。',d:3,v:-.5},
{label:'遠い鏡',desc:'帰還12.5拍、周波数は元の2/3。',d:5,v:.2},
{label:'近づく鏡',desc:'帰還6.67拍、周波数は1.5倍。',d:4,v:-.2}
];let mi=0, md=1,mv=0,mmsg='鏡の距離と移動速度をタップして、戻ってくる光を調整。';
const fmt=n=>Math.abs(n)<1e-8?'0':Number(n.toFixed(2)).toString();const eq=(a,b)=>Math.abs(a-b)<.015;const svgText=(x,y,t,color='#94abc5',size=10)=>`<text x="${x}" y="${y}" fill="${color}" font-size="${size}" text-anchor="middle" font-family="system-ui,sans-serif">${t}</text>`;
function frame(idx,total,title,desc,tag,body,controls,msg,hint){app.innerHTML=`<div class="fade"><div class="meta"><span class="pill">${tag}</span><span class="progress">${String(idx+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</span></div><h2 class="game-title">${title}</h2><div class="story">${desc}</div><div class="scene">${body}</div>${controls}<div class="message${msg.startsWith('CLEAR')?' ok':''}" id="feedback">${msg}</div><div class="actions"><button class="secondary" id="reset">やり直す</button><button class="primary" id="check">判定する</button></div></div>`;$('#note').textContent=hint;$('#reset').addEventListener('click',reset);$('#check').addEventListener('click',check)}
function renderWorld(){const l=worldLevels[wi];let pts=[{t:0,x:0}],x=0,tau=0;for(let k=0;k<l.n;k++){const v=wv[k]/10;x+=v*2;tau+=2*Math.sqrt(1-v*v);pts.push({t:2*(k+1),x})}let sx=x=>160+x*26,sy=t=>19+t*(227/(l.n*2));let grid='';for(let ix=-5;ix<=5;ix++) grid+=`<path d="M${sx(ix)} 15V252" stroke="#39475f" stroke-opacity="${ix===0?.75:.28}" stroke-dasharray="${ix===0?'4 4':'2 6'}"/>`;for(let k=0;k<=l.n;k++)grid+=`<path d="M18 ${sy(k*2)}H302" stroke="#39475f" stroke-opacity=".20"/>`;let lines=pts.slice(1).map((p,k)=>`<line x1="${sx(pts[k].x)}" y1="${sy(pts[k].t)}" x2="${sx(p.x)}" y2="${sy(p.t)}" stroke="${k===ws?'#90eaf7':'#88c7ed'}" stroke-width="${k===ws?4:2.5}" stroke-linecap="round"/>`).join('');let markers=Object.entries(l.cp).map(([k,v])=>`<circle cx="${sx(v)}" cy="${sy(2*Number(k))}" r="8" fill="none" stroke="#ffce84" stroke-width="2" stroke-dasharray="3 2"/>`).join('');const dot=pts.map((p,k)=>`<circle cx="${sx(p.x)}" cy="${sy(p.t)}" r="${k===l.n?5:3.5}" fill="${k===l.n?'#91f2d6':'#b8e5fc'}"/>`).join('');let svg=`<svg viewBox="0 0 320 264" role="img" aria-label="宇宙船の世界線。下方向が時間、横方向が位置">${grid}${markers}${lines}${dot}${svgText(35,261,'位置 →')}${svgText(160,13,'地球 x=0')}${svgText(287,261,'時間 ↓')}</svg>`;let cps=Object.entries(l.cp).every(([k,v])=>eq(pts[Number(k)].x,v));let xok=eq(x,l.x),tok=eq(tau,l.tau);const read=`<div class="readouts"><div class="readout"><div class="k">帰還位置（光年）</div><div class="v ${xok?'good':''}">${fmt(x)}</div><div class="target">目標 ${fmt(l.x)}</div></div><div class="readout"><div class="k">宇宙船の経過時間（年）</div><div class="v ${tok?'good':''}">${fmt(tau)}</div><div class="target">目標 ${fmt(l.tau)}</div></div></div>`;let controls=`${read}<div class="control-title">① 変更する時間区間をタップ</div><div class="segments">${wv.map((v,k)=>`<button class="seg ${ws===k?'active':''}" data-seg="${k}"><small>${2*k}–${2*(k+1)}年</small>${v>0?'+':''}${fmt(v/10)}c</button>`).join('')}</div><div class="control-title">② 宇宙船の速度を選ぶ（＋は右、−は左）</div><div class="options">${sp.map(v=>`<button class="opt ${wv[ws]===v?'active':''}" data-speed="${v}">${v>0?'+':''}${fmt(v/10)}c</button>`).join('')}</div><div class="sub" style="margin-top:12px">${Object.keys(l.cp).length?`黄色い輪は通過する地点。${cps?' ✓':''}`:'青い折れ線は宇宙船の経路。'}</div>`;frame(wi,worldLevels.length,l.label,l.desc,'SPECIAL RELATIVITY',svg,controls,wmsg,'物理式：各区間の船内時間 = 地球時間 × √(1−v²/c²)。途中の速度変更を瞬間的とみなす理想化。');app.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{ws=+b.dataset.seg;renderWorld()});app.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{wv[ws]=+b.dataset.speed;wmsg='世界線と時計が変わった。';beep();renderWorld()})}
function renderCausal(){const l=causalLevels[ci];const nodes=l.nodes.map(([name,x,t,kind])=>({name,x,t,kind}));const get=name=>nodes.find(n=>n.name===name),cur=get(path.at(-1));const sx=x=>160+x*21,sy=t=>22+t*15.6;let grid='';for(let ix=-6;ix<=6;ix+=2)grid+=`<path d="M${sx(ix)} 10V247" stroke="#39475f" stroke-opacity=".22"/>`;for(let t=0;t<=14;t+=2)grid+=`<path d="M12 ${sy(t)}H308" stroke="#39475f" stroke-opacity=".22"/>`;const light=`<path d="M${sx(cur.x)} ${sy(cur.t)} L${sx(cur.x-(14-cur.t))} ${sy(14)} L${sx(cur.x+(14-cur.t))} ${sy(14)} Z" fill="#66dcf2" fill-opacity=".075" stroke="none"/>`;const lines=path.slice(1).map((n,i)=>{const a=get(path[i]),b=get(n);return `<line x1="${sx(a.x)}" y1="${sy(a.t)}" x2="${sx(b.x)}" y2="${sy(b.t)}" stroke="#75dbe9" stroke-width="3"/>`}).join('');const dots=nodes.map(n=>{let done=path.includes(n.name),reach=n.t>cur.t && Math.abs(n.x-cur.x)<=n.t-cur.t+1e-8, col=done?'#91f2d6':n.kind===2?'#9fefbd':n.kind===1?'#ffd296':'#708cad';return `<g class="node" data-node="${n.name}"><circle cx="${sx(n.x)}" cy="${sy(n.t)}" r="${n.kind===0?12:14}" fill="#142235" stroke="${col}" stroke-width="${reach?2.5:1.5}" opacity="${reach||done?.99:.65}"/><text x="${sx(n.x)}" y="${sy(n.t)+3.8}" fill="${col}" font-size="11" text-anchor="middle" font-weight="750">${n.name}</text></g>`}).join('');let svg=`<svg viewBox="0 0 320 259" role="img" aria-label="時間と距離の図。未来へ届く光円錐の領域">${grid}${light}${lines}${dots}${svgText(45,252,'位置 →')}${svgText(287,252,'時間 ↓')}</svg>`;let rem=nodes.filter(n=>n.kind===1&&!path.includes(n.name)).map(n=>n.name);let controls=`<div class="readouts"><div class="readout"><div class="k">通過した中継点</div><div class="v" style="font-size:17px">${path.join(' → ')}</div><div class="target">最大接続数 ${l.max-1}</div></div><div class="readout"><div class="k">残りの必須中継点</div><div class="v" style="font-size:17px">${rem.length?rem.join(' · '):'なし'}</div><div class="target">黄色：必須／緑：ゴール</div></div></div><div class="sub">水色の領域が、今いるイベントから光速以下で到達できる未来。点を直接タップして経路を作る。</div>`;frame(ci,causalLevels.length,l.label,l.desc,'CAUSAL STRUCTURE',svg,controls,cmsg,'物理ルール：次の出来事には Δt ≥ |Δx| / c の場合のみ届く。これは相対論の光円錐の基本であり、単独では通常の経路パズルに近い。');app.querySelectorAll('[data-node]').forEach(g=>g.onclick=()=>{const n=get(g.dataset.node);if(n.name===cur.name)return;if(n.t<=cur.t){cmsg='過去の出来事には信号を送れない。';beep();renderCausal();return}if(Math.abs(n.x-cur.x)>n.t-cur.t+1e-8){cmsg='そこは光円錐の外。光速を超えないと届かない。';beep();renderCausal();return}if(path.length>=l.max){cmsg='中継回数の上限に達した。最初から考え直そう。';beep();renderCausal();return}path.push(n.name);cmsg=`${n.name} に到達した。残る必須点を確認しよう。`;beep();renderCausal()})}
function renderMirror(){const l=mirrorLevels[mi],ret=2*md/(1-mv),ratio=(1-mv)/(1+mv);const tx=l.only==='f'?null:2*l.d/(1-l.v),fx=l.only==='t'?null:(1-l.v)/(1+l.v);const rok=tx===null||eq(ret,tx),fok=fx===null||eq(ratio,fx);let mirrorX=220;let lightHit=md/(1-mv);let wavePath=`M48 142L${mirrorX} 142L48 142`,svg=`<svg viewBox="0 0 320 264" role="img" aria-label="右側の鏡で反射する光。鏡が近づいたり遠ざかったりする"><defs><linearGradient id="rr"><stop stop-color="#5dd8e6"/><stop offset="1" stop-color="#c9f8fe"/></linearGradient></defs><path d="M20 143H301" stroke="#3f5671" stroke-width="1" stroke-dasharray="4 8"/><path d="M46 124V162" stroke="#93a7c2" stroke-width="4" stroke-linecap="round"/><circle cx="47" cy="143" r="7" fill="#9ef3fe"/><path d="M47 143H219" stroke="url(#rr)" stroke-width="3.8" stroke-linecap="round"/><path d="M219 154H47" stroke="${ratio>1?'#8cd8ff':ratio<1?'#ffadab':'#bcf4ef'}" stroke-width="3.5" stroke-dasharray="8 6"/><path d="M220 101V187" stroke="#f4d3a8" stroke-width="7" stroke-linecap="round"/><path d="M233 112l${mv>0?29:mv<0?-29:0} 0m${mv>0?0:mv<0?0:0} 0" stroke="#ffcf89" stroke-width="2.5"/><circle cx="219" cy="143" r="34" stroke="#ffcb8644" fill="none"/><text x="48" y="98" fill="#9aabbf" font-size="12" text-anchor="middle">送信機</text><text x="222" y="88" fill="#ffd6a3" font-size="12" text-anchor="middle">鏡</text>${svgText(160,223,'実線：往路  /  破線：復路','#8fa3c3',10)}${svgText(160,243,'光の速さは常に c','#7b91ae',11)}</svg>`;let controls=`<div class="readouts"><div class="readout"><div class="k">光が戻るまで</div><div class="v ${rok?'good':''}">${fmt(ret)} 拍</div><div class="target">目標 ${tx===null?'自由':fmt(tx)+' 拍'}</div></div><div class="readout"><div class="k">戻った光の周波数</div><div class="v ${fok?'good':''}">${fmt(ratio)} ×</div><div class="target">目標 ${fx===null?'自由':fmt(fx)+' ×'}</div></div></div><div class="control-title">① 鏡の初期距離（光が1拍で進む距離＝1）</div><div class="options">${[1,2,3,4,5].map(d=>`<button class="opt ${md===d?'active':''}" data-dist="${d}">${d}</button>`).join('')}</div><div class="control-title">② 鏡の移動速度（負は送信機に近づく）</div><div class="options">${[-.5,-.2,0,.2,.5].map(v=>`<button class="opt ${mv===v?'active':''}" data-v="${v}">${v>0?'+':''}${fmt(v)}c</button>`).join('')}</div>`;frame(mi,mirrorLevels.length,l.label,l.desc,'RELATIVISTIC DOPPLER',svg,controls,mmsg,'物理式：帰還時刻 2d/(c−v)（c=1）、反射後の周波数比 (c−v)/(c+v)。鏡は等速で動き、完全反射する理想化。');app.querySelectorAll('[data-dist]').forEach(b=>b.onclick=()=>{md=+b.dataset.dist;mmsg='鏡の初期距離を変更した。';beep();renderMirror()});app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{mv=+b.dataset.v;mmsg='鏡の速度を変更した。';beep();renderMirror()})}
function check(){if(mode==='world'){const l=worldLevels[wi];let x=0,tau=0,at={};wv.forEach((v,k)=>{x+=v/5;tau+=2*Math.sqrt(1-(v/10)**2);at[k+1]=x});const ok=eq(x,l.x)&&eq(tau,l.tau)&&Object.entries(l.cp).every(([k,x])=>eq(at[+k],x));if(ok){wmsg='CLEAR  ·  世界線がぴったり一致！';beep(true);if(wi<worldLevels.length-1){renderWorld();setTimeout(()=>{if(mode!=='world')return;wi++;wv=Array(worldLevels[wi].n).fill(0);ws=0;wmsg='次の挑戦。黄色の通過点にも注目。';renderWorld()},900);return}else wmsg='CLEAR  ·  WORLDLINE 全問達成！'}else{wmsg='まだ条件に一致しない。帰還位置・船内時計・黄色い地点を見直してみよう。';beep()}renderWorld()}else if(mode==='causal'){const l=causalLevels[ci],req=l.nodes.filter(n=>n[3]===1).map(n=>n[0]);const ok=path.at(-1)==='G'&&req.every(n=>path.includes(n))&&path.length<=l.max;if(ok){cmsg='CLEAR  ·  因果の経路がつながった！';beep(true);if(ci<causalLevels.length-1){renderCausal();setTimeout(()=>{if(mode!=='causal')return;ci++;path=['S'];cmsg='次の経路を考えよう。';renderCausal()},900);return}else cmsg='CLEAR  ·  CAUSAL 全問達成！'}else{cmsg='まだ条件未達成。必須の黄色い点を全部通り、緑のゴールに到着しよう。';beep()}renderCausal()}else{const l=mirrorLevels[mi],t=2*md/(1-mv),f=(1-mv)/(1+mv),ok=(l.only==='f'||eq(t,2*l.d/(1-l.v)))&&(l.only==='t'||eq(f,(1-l.v)/(1+l.v)));if(ok){mmsg='CLEAR  ·  光の帰還がぴったり一致！';beep(true);if(mi<mirrorLevels.length-1){renderMirror();setTimeout(()=>{if(mode!=='mirror')return;mi++;md=1;mv=0;mmsg='次の反射条件を満たそう。';renderMirror()},900);return}else mmsg='CLEAR  ·  MIRROR 全問達成！'}else{mmsg='まだ条件に一致しない。帰還時間と周波数を同時に見てみよう。';beep()}renderMirror()}}
