<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overscroll-behavior:none}body{font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:radial-gradient(ellipse 88% 49% at 52% 16%,#20345c 0%,#101d36 50%,var(--bg) 100%);display:flex;justify-content:center;align-items:flex-start;user-select:none;-webkit-user-select:none}button{font:inherit;cursor:pointer}main{width:min(100%,468px);padding:14px 18px max(24px,env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;gap:12px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:10px;font-weight:900;letter-spacing:3px;color:#90a9ce}.brand span{color:#7ce8ed}.tinyBtns{display:flex;gap:7px}.tiny{border:1px solid #344662;background:#1a2b46;color:#b7cce8;border-radius:15px;min-height:38px;min-width:42px;padding:7px 11px;font-size:18px;display:grid;place-items:center}.tiny:active{transform:scale(.96)}.headBlock{display:flex;justify-content:space-between;align-items:center;gap:14px}.heading{font-size:clamp(21px,6vw,27px);letter-spacing:.03em;font-weight:900;line-height:1.35}.sub{font-size:12px;color:#a7b8d0;line-height:1.6;margin-top:3px}.level{display:flex;flex-direction:column;align-items:flex-end;gap:4px;white-space:nowrap}.level strong{font-size:15px;letter-spacing:1px}.level span{font-size:11px;color:#adc1dc}.progress{display:flex;gap:5px;justify-content:flex-end;margin-top:5px}.progress i{height:5px;width:9px;border-radius:9px;background:#344967;display:block}.progress i.done{background:var(--a)}.progress i.cur{width:16px;background:var(--gold)}.clocks{display:grid;grid-template-columns:1fr 1fr;gap:11px}.clockCard{height:63px;background:linear-gradient(135deg,#233759b5,#162746ae);border:1px solid #344864;border-radius:20px;display:flex;align-items:center;padding:8px 11px;gap:11px;min-width:0;box-shadow:inset 0 1px #ffffff0d}.clock{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;border:2px solid var(--a);box-shadow:0 0 14px #5be0ef16;flex-shrink:0}.clock.red{border-color:var(--b);box-shadow:0 0 14px #ffae9016}.clock:before{content:"";width:5px;height:5px;border-radius:100%;background:var(--a);position:absolute;z-index:3}.clock.red:before{background:var(--b)}.clockHand{position:absolute;width:3px;height:15px;bottom:50%;border-radius:3px;background:var(--a);transform-origin:bottom center;transition:transform .26s cubic-bezier(.2,.9,.25,1.1)}.clock.red .clockHand{background:var(--b)}.clockInfo{min-width:0;display:flex;flex-direction:column;gap:4px}.clockInfo strong{font-size:13px;letter-spacing:.02em}.clockInfo em{font-size:10px;font-style:normal;color:#abc1dc;white-space:nowrap}.clockCard.flash{animation:cardflash .45s ease}@keyframes cardflash{50%{border-color:#ffffff88;transform:scale(1.025)}}.boardframe{position:relative;padding:7px;background:linear-gradient(145deg,#233552,#111e33);border:1px solid #364a69;border-radius:26px;box-shadow:0 18px 50px #0004,inset 0 1px #ffffff25;touch-action:none;overflow:hidden}.boardframe:after{content:"";pointer-events:none;position:absolute;inset:0;border-radius:26px;box-shadow:inset 0 0 32px #030d1b48}canvas{width:100%;height:auto;aspect-ratio:1;display:block;touch-action:none;border-radius:19px}.tip{font-size:12px;color:#b1c2dc;text-align:center;min-height:20px;letter-spacing:.02em}.tip b{color:#ffdf9f}.controls{display:flex;align-items:center;justify-content:space-between;gap:10px}.action{border:1px solid #3b4f6c;border-radius:17px;background:#202f4b;color:#d5e5f6;padding:12px 17px;min-height:45px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center}.action:disabled{opacity:.35;cursor:default}.action:active{transform:scale(.97)}.swipeMsg{color:#899fbe;text-align:center;font-size:12px;flex:1}.swipeMsg strong{color:#c3d4ea;font-size:16px;padding:0 6px}footer{text-align:center;font-size:10px;color:#7087a9;line-height:1.8;margin-top:auto;padding-top:2px}.overlay{position:absolute;inset:7px;z-index:5;border-radius:20px;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,#233556ed,#0c1732e8);gap:12px;text-align:center;padding:20px}.overlay.open{display:flex;animation:pop .25s ease}@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}.overIcon{font-size:62px;filter:drop-shadow(0 0 25px #ffe8a440)}.overTitle{font-weight:900;font-size:35px;letter-spacing:3px}.overSub{font-size:14px;color:#c2d5ed;line-height:1.6}.next{font-weight:900;border:0;border-radius:17px;padding:15px 36px;min-width:180px;margin-top:9px;color:#082436;background:linear-gradient(140deg,#ffde91,#89edf1);box-shadow:0 7px 25px #76d6ed30;font-size:17px}.next:active{transform:scale(.97)}.modal{position:fixed;z-index:20;inset:0;background:#071123d8;display:none;align-items:center;justify-content:center;padding:24px}.modal.open{display:flex}.modalInner{width:min(410px,100%);max-height:85dvh;overflow:auto;background:#1a2b48;border:1px solid #4b6385;border-radius:24px;padding:22px;box-shadow:0 30px 70px #0008}.modalH{display:flex;align-items:center;justify-content:space-between}.modal h2{font-size:19px;margin:0 0 12px}.modal p{line-height:1.8;color:#d2deef;font-size:14px}.modal .small{color:#9db1ce;font-size:12px}.stagegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}.stagePick{border:1px solid #4c6280;background:#263a5c;border-radius:13px;min-height:58px;color:white;font-weight:800;font-size:19px}.stagePick.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.stagePick:disabled{opacity:.33}.close{border:0;background:#334968;color:white;border-radius:12px;padding:7px 12px}.secretBtn{border:0;background:none;color:#8aa4c8;text-decoration:underline;font-size:12px;padding:8px;display:block;margin:auto}.tutorial{position:absolute;inset:7px;pointer-events:none;display:none;justify-content:center;align-items:end;padding-bottom:10%;z-index:4}.tutorial.show{display:flex}.touchMark{height:45px;width:150px;display:flex;align-items:center;justify-content:center;border-radius:60px;background:#16233bb8;color:#f0f7ff;border:1px solid #7b9bbe6b;font-size:14px;font-weight:900;gap:7px;animation:sway 1.6s ease-in-out infinite alternate}@keyframes sway{from{transform:translateX(-19px)}to{transform:translateX(19px)}}
@media(max-height:740px){main{gap:7px;padding-top:8px}.clockCard{height:54px}.clock{width:36px;height:36px}.clockHand{height:12px}.headBlock{min-height:48px}.heading{font-size:21px}.boardframe{margin:auto 0}.sub{font-size:11px}.action{min-height:39px;padding:8px 15px}.tip{font-size:11px}}
@media(max-width:355px){main{padding-left:10px;padding-right:10px;gap:8px}.heading{font-size:21px}.clockCard{padding:6px;gap:7px}.clockInfo strong{font-size:12px}.clockInfo em{font-size:9px}.action{padding:10px 12px}}

</head>
<body>
<main>
 <header><div class="brand">TWIN <span>TEMPO</span></div><div class="tinyBtns"><button class="tiny" id="levelMenu" aria-label="ステージをえらぶ">☷</button><button class="tiny" id="sound" aria-label="おとをきりかえる">♫</button></div></header>
 <div class="headBlock"><div><div class="heading">ふたりで ゴール！</div><div class="sub" id="subtitle">ふたりは、おなじむきに うごくよ。</div></div><div class="level"><strong id="levelNum">01 / 08</strong><span id="best"></span><div class="progress" id="progress"></div></div></div>
 <div class="clocks">
  <div class="clockCard" id="blueCard"><div class="clock"><div class="clockHand" id="blueHand"></div></div><div class="clockInfo"><strong style="color:var(--a)">あおの とけい</strong><em id="blueStatus">いつもの はやさ</em></div></div>
  <div class="clockCard" id="redCard"><div class="clock red"><div class="clockHand" id="redHand"></div></div><div class="clockInfo"><strong style="color:var(--b)">あかの とけい</strong><em id="redStatus">いつもの はやさ</em></div></div>
 </div>
 <div class="boardframe" id="boardframe"><canvas id="board" width="720" height="720" aria-label="2台をそれぞれのおうちまでスワイプで動かすパズル"></canvas>
  <div class="tutorial" id="tutorial"><div class="touchMark">☝　→　スワイプ！</div></div>
  <div class="overlay" id="victory"><div class="overIcon" id="overIcon">✦</div><div class="overTitle" id="overTitle">ぴったり！</div><div class="overSub" id="overSub">ふたりとも、おうちに かえれた！</div><button class="next" id="next">つぎへ　➜</button></div>
 </div>
 <div class="tip" id="tip">ふたりを <b>おなじ むき</b> に うごかそう</div>
 <div class="controls"><button id="undo" class="action" aria-label="ひとつもどす">↶　もどす</button><div class="swipeMsg"><span id="steps">0</span> て<br><strong>↖ ↑ ↗</strong></div><button id="restart" class="action" aria-label="やりなおす">⟲　やりなおす</button></div>
 <footer>あせらなくて だいじょうぶ。なんどでも やりなおせるよ。<button id="secretBtn" class="secretBtn">この ふしぎの ひみつ</button></footer>
</main>
<div class="modal" id="modal"><div class="modalInner"><div class="modalH"><h2 id="modalTitle">ステージを えらぶ</h2><button class="close" id="modalClose">とじる ✕</button></div><div id="modalContent"></div></div></div>
<script>
(()=>{'use strict';
// In this toy world, robots' local clock controls their motor. Near the star
// local proper-time rate is 1/2 of that measured by the distant station.
// The rate is intentionally quantized for gameplay; no physical GR metric is claimed.
const RAW=[
 {name:'いっしょに、しゅっぱつ',subtitle:'あおは あおへ。あかは あかへ。',map:['.....','.....','.A.a.','.B.b.','.....']},
 {name:'ゆっくりの ほし',subtitle:'むらさきの ほしで なにかが おこる…',map:['.....','A.*a.','.....','B...b','.....']},
 {name:'わざと もどろう',subtitle:'ちがう ばしょに かえれるかな？',map:['.....','A.*.a','.....','B..b.','.....']},
 {name:'ちがう みち',subtitle:'うえに いったら どうなる？',map:['...ab','.A*..','.....','.B...','.....']},
 {name:'まよいぼし',subtitle:'とけいを よく みてみよう',map:['.....','..a*.','.Bb..','.A...','.....']},
 {name:'ぐるり、ふたり',subtitle:'じかんの ずれを つかおう',map:['B....','.A.*.','.....','...b.','..a..']},
 {name:'とおりみち',subtitle:'じぶんの とけいで すすむ',map:['.....','..b..','.A...','B*a..','.....']},
 {name:'ふたりの じかん',subtitle:'さいごの チャレンジ！',map:['.*a..','.A...','B...b','.....','.....']}
];
const CW=5, CH=5, SIZE=720, MARGIN=45, TILE=(SIZE-MARGIN*2)/5, dirs={U:[0,-1],R:[1,0],D:[0,1],L:[-1,0]};
const levels=RAW.map((l,i)=>{const o={a:null,b:null,ga:null,gb:null,wells:new Set(),walls:new Set()};l.map.forEach((line,y)=>[...line].forEach((c,x)=>{const key=x+','+y;if(c==='A')o.a={x,y};else if(c==='B')o.b={x,y};else if(c==='a')o.ga={x,y};else if(c==='b')o.gb={x,y};else if(c==='*')o.wells.add(key);else if(c==='#')o.walls.add(key)}));return {...l,...o,id:i}});
const $=s=>document.querySelector(s);const canvas=$('#board'),cx=canvas.getContext('2d');
const baseKeys=['twin-tempo-best-v1','twin-tempo-unlock-v1'];
const storage={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const best=JSON.parse(storage.get(baseKeys[0])||'{}');let unlocked=Number(storage.get(baseKeys[1])||0);
let levelIndex=0,lv=levels[0],state,undoStack=[],moveCount=0,clockA=0,clockB=0,won=false,moveAnim=null,gesture=null,seenMove=false,firstSlow=false;
let soundOn=true,audio=null,lastMove='',notice='',noticeUntil=0, winParticles=[];
const now=()=>performance.now();
function initAudio(){if(!soundOn)return null;if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(audio.state==='suspended')audio.resume().catch(()=>{});return audio}
function tone(freq,time,dur=.1,vol=.055,type='sine'){const a=initAudio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,a.currentTime+time);g.gain.setValueAtTime(.0001,a.currentTime+time);g.gain.exponentialRampToValueAtTime(Math.max(vol,.001),a.currentTime+time+.012);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+time+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+time);o.stop(a.currentTime+time+dur+.02)}
function playStep(changed,slow){if(!soundOn)return;if(changed)tone(440+moveCount%7*27,0,.10,.042,'triangle');if(slow)tone(270,0,.15,.025,'sine')}
function playWin(){if(!soundOn)return;[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.092,.38,.052,'sine'))}
function pos(p){return p.x+','+p.y}function clone(s){return {a:{...s.a},b:{...s.b},pa:s.pa,pb:s.pb}}
function fresh(l){return {a:{...l.a},b:{...l.b},pa:0,pb:0}}
function same(p,q){return p.x===q.x&&p.y===q.y}
function isSlow(p){return lv.wells.has(pos(p))}
function nextOne(p,phase,dir){const slow=isSlow(p);if(slow&&phase===0)return {p:{...p},phase:1,slow:true,moved:false};const np={x:p.x+dirs[dir][0],y:p.y+dirs[dir][1]};const legal=np.x>=0&&np.x<CW&&np.y>=0&&np.y<CH&&!lv.walls.has(pos(np));return{p:legal?np:{...p},phase:0,slow:false,moved:legal}}
function simulate(s,dir){const a=nextOne(s.a,s.pa,dir),b=nextOne(s.b,s.pb,dir);return{s:{a:a.p,b:b.p,pa:a.phase,pb:b.phase},a,b}}
function solved(s){return same(s.a,lv.ga)&&same(s.b,lv.gb)}
function goalInstruction(){return `${lv.name}`}
function loadLevel(i){levelIndex=Math.max(0,Math.min(levels.length-1,i));lv=levels[levelIndex];state=fresh(lv);undoStack=[];moveCount=0;clockA=0;clockB=0;won=false;moveAnim=null;gesture=null;firstSlow=false;notice='';lastMove='';winParticles=[];$('#victory').classList.remove('open');$('#tutorial').classList.toggle('show',levelIndex===0&&!seenMove);$('#levelNum').textContent=String(levelIndex+1).padStart(2,'0')+' / '+String(levels.length).padStart(2,'0');$('#subtitle').textContent=lv.subtitle;$('#best').textContent=best[levelIndex]?'BEST '+best[levelIndex]+'て':'';$('#progress').innerHTML=levels.map((_,i)=>`<i class="${i<levelIndex?'done':i===levelIndex?'cur':''}"></i>`).join('');$('#tip').innerHTML=levelIndex===0?'ふたりを <b>おなじ むき</b> に うごかそう':levelIndex===1?'むらさきの ほしに ちゅうもく！':'<b>ちがう はやさ</b>を うまく つかおう';refreshUI()}
function refreshUI(){const slowA=isSlow(state.a),slowB=isSlow(state.b);$('#blueStatus').textContent=slowA?'とけいが ゆっくり':'いつもの はやさ';$('#redStatus').textContent=slowB?'とけいが ゆっくり':'いつもの はやさ';$('#blueHand').style.transform=`rotate(${clockA*80}deg)`;$('#redHand').style.transform=`rotate(${clockB*80}deg)`;$('#steps').textContent=moveCount;$('#undo').disabled=!undoStack.length||won;$('#restart').disabled=moveCount===0||won}
function applyMove(dir){if(won||moveAnim||!dirs[dir])return;seenMove=true;$('#tutorial').classList.remove('show');const old=clone(state),r=simulate(state,dir);if(same(old.a,r.s.a)&&same(old.b,r.s.b)&&old.pa===r.s.pa&&old.pb===r.s.pb){tone(220,0,.07,.025,'triangle');return}undoStack.push({state:old,moveCount,clockA,clockB});clockA+=isSlow(old.a)?.5:1;clockB+=isSlow(old.b)?.5:1;state=r.s;moveCount++;lastMove=dir;const t=now();moveAnim={start:t,old,updated:clone(state),dir};if((r.a.slow||r.b.slow)&&!firstSlow){firstSlow=true;notice=r.a.slow?'あれ？ あおだけ ひとやすみ！':'あれ？ あかだけ ひとやすみ！';noticeUntil=t+1750;$('#tip').innerHTML=`<b>${notice}</b>`;setTimeout(()=>{if(now()>noticeUntil&&!won)$('#tip').innerHTML='むらさきの そばは <b>じかんが ゆっくり</b>'},1900)}
 if(r.a.slow)$('#blueCard').classList.add('flash');if(r.b.slow)$('#redCard').classList.add('flash');setTimeout(()=>{$('#blueCard').classList.remove('flash');$('#redCard').classList.remove('flash')},450);
 playStep(r.a.moved||r.b.moved,r.a.slow||r.b.slow);refreshUI();if(solved(state))setTimeout(win,350)}
function win(){if(won||!solved(state))return;won=true;moveAnim=null;playWin();if(!best[levelIndex]||moveCount<best[levelIndex])best[levelIndex]=moveCount;storage.set(baseKeys[0],JSON.stringify(best));unlocked=Math.max(unlocked,Math.min(levels.length-1,levelIndex+1));storage.set(baseKeys[1],String(unlocked));$('#overIcon').textContent=levelIndex===levels.length-1?'🌟':'✦';$('#overTitle').textContent=levelIndex===levels.length-1?'すごい！':'ぴったり！';$('#overSub').textContent=levelIndex===levels.length-1?'ふたりの じかんを つかいこなしたね！':moveCount+'てで、ふたりとも おうちに とうちゃく！';$('#next').textContent=levelIndex===levels.length-1?'もういちど あそぶ':'つぎへ　➜';$('#victory').classList.add('open');for(let i=0;i<75;i++)winParticles.push({x:Math.random()*SIZE,y:Math.random()*SIZE,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,life:Math.random()*.9+.4,c:i%3});refreshUI()}
function undo(){if(!undoStack.length||won||moveAnim)return;const prev=undoStack.pop();state=clone(prev.state);moveCount=prev.moveCount;clockA=prev.clockA;clockB=prev.clockB;notice='';refreshUI();tone(360,0,.13,.034,'triangle')}
function reset(){if(won)return;loadLevel(levelIndex);tone(330,0,.09,.03,'triangle')}
function preview(dir){if(!dir||!dirs[dir])return null;return simulate(state,dir)}
// Draw
function rr(x,y,w,h,r,fill,stroke=null,lw=1){cx.beginPath();cx.roundRect(x,y,w,h,r);if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=lw;cx.stroke()}}
function circ(x,y,r,fill,stroke=null,lw=1){cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=lw;cx.stroke()}}
function center(p){return {x:MARGIN+(p.x+.5)*TILE,y:MARGIN+(p.y+.5)*TILE}}
function drawStarWell(p,t){const {x,y}=center(p);let glow=cx.createRadialGradient(x,y,4,x,y,TILE*.62);glow.addColorStop(0,'#c9aaff66');glow.addColorStop(.46,'#a06dff38');glow.addColorStop(1,'#9466fd00');circ(x,y,TILE*.68,glow);cx.save();cx.translate(x,y);cx.rotate(t*.00028);for(let i=0;i<3;i++){cx.beginPath();cx.ellipse(0,0,24+i*9,12+i*7,(i*Math.PI)/3,0,Math.PI*1.63);cx.strokeStyle=['#d7c4ffb0','#a8a6ff85','#a7a5ff55'][i];cx.lineWidth=2.1;cx.lineCap='round';cx.stroke()}cx.restore();circ(x,y,17,'#856bda');circ(x-4,y-4,8,'#dbc8ff');circ(x+5,y+5,4,'#534190');}
function drawGoal(p,color,t){const {x,y}=center(p);const ring=t*.002;const g=cx.createRadialGradient(x,y,3,x,y,38);g.addColorStop(0,color+'38');g.addColorStop(1,color+'00');circ(x,y,41,g);circ(x,y,30,'#132b42ca',color,4);cx.strokeStyle=color+'b0';cx.lineWidth=1.7;cx.beginPath();cx.arc(x,y,23,-Math.PI/2,-Math.PI/2+Math.PI*1.45);cx.stroke();for(let i=0;i<5;i++){let a=i*2*Math.PI/5+ring;cx.save();cx.translate(x+Math.cos(a)*34,y+Math.sin(a)*34);cx.rotate(a);rr(-2,-4,4,8,2,color+'9a');cx.restore()}cx.save();cx.translate(x,y);cx.strokeStyle=color;cx.lineWidth=3;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();cx.moveTo(-12,-1);cx.lineTo(0,-12);cx.lineTo(12,-1);cx.moveTo(-9,-2);cx.lineTo(-9,10);cx.lineTo(9,10);cx.lineTo(9,-2);cx.stroke();rr(-3,2,6,8,2,color+'a0');cx.restore()}
function robot(p,color,phase,blink,t,label){const {x,y}=p;cx.save();cx.translate(x,y);cx.shadowColor=color;cx.shadowBlur=13;circ(0,5,29,'#07162999');cx.shadowBlur=0;circ(0,0,28,color,'#ffffff9f',2);let g=cx.createLinearGradient(-25,-30,20,22);g.addColorStop(0,'#ffffff8f');g.addColorStop(1,'#ffffff00');circ(-5,-8,22,g);circ(-9,-1,2.9,'#152c46');circ(9,-1,2.9,'#152c46');cx.strokeStyle='#24354a';cx.lineWidth=2.4;cx.lineCap='round';cx.beginPath();cx.arc(0,4,8,.12*Math.PI,.88*Math.PI);cx.stroke();if(phase){cx.strokeStyle='#ffdf89';cx.lineWidth=4;cx.beginPath();cx.arc(0,0,34,-Math.PI/2,Math.PI/2);cx.stroke();circ(0,-34,3,'#ffdf89')}cx.restore()}
function interp(from,to,frac){return{x:from.x+(to.x-from.x)*frac,y:from.y+(to.y-from.y)*frac}}
function drawBackground(t){const g=cx.createLinearGradient(0,0,SIZE,SIZE);g.addColorStop(0,'#152b48');g.addColorStop(.55,'#101f38');g.addColorStop(1,'#101931');rr(0,0,SIZE,SIZE,25,g);for(let i=0;i<38;i++){const x=(43*i*17+61)%SIZE,y=(i*73+19)%SIZE,c=.12+.17*Math.sin(t*.0006+i);circ(x,y,i%4===0?1.7:1,'rgba(207,223,255,'+c+')')}for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){const xx=MARGIN+x*TILE+4, yy=MARGIN+y*TILE+4;rr(xx,yy,TILE-8,TILE-8,15, (x+y)%2?'#21365055':'#263a5452','#58718d24',1)}
 // Gently bowed grid lines to hint at curved spacetime, not a GR simulation.
 for(const key of lv.wells){const [sx,sy]=key.split(',').map(Number),p=center({x:sx,y:sy});for(let j=-1;j<=1;j++){let yy=p.y+j*35;cx.beginPath();cx.moveTo(p.x-69,yy);cx.quadraticCurveTo(p.x,yy+(j===0?0:Math.sign(j)*14),p.x+69,yy);cx.strokeStyle='#a79bf019';cx.lineWidth=1.5;cx.stroke()}}}
function arrow(x1,y1,x2,y2,color,alpha=1){const a=Math.atan2(y2-y1,x2-x1);cx.save();cx.globalAlpha=alpha;cx.strokeStyle=color;cx.lineWidth=4;cx.lineCap='round';cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke();cx.fillStyle=color;cx.beginPath();cx.moveTo(x2,y2);cx.lineTo(x2-13*Math.cos(a-.45),y2-13*Math.sin(a-.45));cx.lineTo(x2-13*Math.cos(a+.45),y2-13*Math.sin(a+.45));cx.closePath();cx.fill();cx.restore()}
function draw(t){cx.clearRect(0,0,SIZE,SIZE);drawBackground(t);for(const key of lv.wells){const [x,y]=key.split(',').map(Number);drawStarWell({x,y},t)}for(const key of lv.walls){const [x,y]=key.split(',').map(Number);const xx=MARGIN+x*TILE+10,yy=MARGIN+y*TILE+10;rr(xx,yy,TILE-20,TILE-20,13,'#53657f','#7e93b1',2);rr(xx+6,yy+6,TILE-32,15,6,'#9aabc44c')}drawGoal(lv.ga,'#5be0ef',t);drawGoal(lv.gb,'#ffae90',t);
 let at=center(state.a),bt=center(state.b);
 if(moveAnim){let f=Math.min(1,(t-moveAnim.start)/250);f=1-Math.pow(1-f,3);at=center(interp(moveAnim.old.a,state.a,f));bt=center(interp(moveAnim.old.b,state.b,f));if(f>=1)moveAnim=null}
 const phaseShake=(p)=>isSlow(p)?Math.sin(t*.006)*1.8:0;
 if(gesture?.dir){const r=preview(gesture.dir);if(r){const a0=center(state.a),b0=center(state.b),na=center(r.s.a),nb=center(r.s.b);cx.setLineDash([7,7]);arrow(a0.x,a0.y,na.x,na.y,'#5be0ef',.45);arrow(b0.x,b0.y,nb.x,nb.y,'#ffae90',.45);cx.setLineDash([]);cx.globalAlpha=.3;robot(na,'#5be0ef',r.s.pa,false,t,'あお');robot(nb,'#ffae90',r.s.pb,false,t,'あか');cx.globalAlpha=1}}
 if(same(state.a,state.b)&&!moveAnim){at.x-=12;bt.x+=12}
 robot({...at,y:at.y+phaseShake(state.a)},'#5be0ef',state.pa,false,t,'あお');robot({...bt,y:bt.y+phaseShake(state.b)},'#ffae90',state.pb,false,t,'あか');
 if(won){for(const p of winParticles){p.x+=p.vx;p.y+=p.vy;p.life-=.008;if(p.life>0)circ(p.x,p.y,3.2,['#ffd985','#7ce7f1','#ffb18e'][p.c]);}}
 requestAnimationFrame(draw)}
function dirFromMove(dx,dy){if(Math.abs(dx)<22&&Math.abs(dy)<22)return null;return Math.abs(dx)>Math.abs(dy)?dx>0?'R':'L':dy>0?'D':'U'}
canvas.addEventListener('pointerdown',e=>{if(won)return;gesture={x:e.clientX,y:e.clientY,dir:null};canvas.setPointerCapture(e.pointerId);initAudio()});canvas.addEventListener('pointermove',e=>{if(!gesture)return;gesture.dir=dirFromMove(e.clientX-gesture.x,e.clientY-gesture.y)});canvas.addEventListener('pointerup',e=>{if(!gesture)return;const dir=dirFromMove(e.clientX-gesture.x,e.clientY-gesture.y);gesture=null;if(dir)applyMove(dir)});canvas.addEventListener('pointercancel',()=>gesture=null);
window.addEventListener('keydown',e=>{const d={ArrowUp:'U',ArrowRight:'R',ArrowDown:'D',ArrowLeft:'L',w:'U',d:'R',s:'D',a:'L'}[e.key];if(d){e.preventDefault();applyMove(d)}if(e.key==='Backspace'||e.key==='z'){e.preventDefault();undo()}if(e.key==='Escape')$('#modal').classList.remove('open')});
$('#undo').onclick=undo;$('#restart').onclick=reset;$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'♫':'♩';if(soundOn)tone(523,0,.1,.04)};$('#next').onclick=()=>{loadLevel(levelIndex===levels.length-1?0:levelIndex+1);tone(600,0,.08,.03)};
function showModal(which){$('#modal').classList.add('open');if(which==='levels'){$('#modalTitle').textContent='ステージを えらぶ';$('#modalContent').innerHTML='<p class="small">あそんだ ステージは いつでも もどれるよ。</p><div class="stagegrid">'+levels.map((l,i)=>`<button class="stagePick ${i===levelIndex?'selected':''}" data-i="${i}" ${i>unlocked?'disabled':''}>${i>unlocked?'🔒':i+1}</button>`).join('')+'</div>';document.querySelectorAll('.stagePick').forEach(e=>e.onclick=()=>{loadLevel(Number(e.dataset.i));$('#modal').classList.remove('open')})}else{$('#modalTitle').textContent='じかんの ひみつ';$('#modalContent').innerHTML='<p>むらさきの ほしの そばでは、あおや あかの「とけい」が ゆっくり すすんでいたね。</p><p>じつは、ものすごく つよい じゅうりょくの そばでは、はなれた ところから くらべると、<strong>じかんの すすみかたが ちがう</strong>んだ。</p><p>これは「<strong>いっぱん そうたいせいりろん</strong>」につながる ほんとうの ふしぎ。</p><p class="small">※ゲームでは体験しやすいよう、星のそばの時計を半分の速さにした模型です。宇宙で時間が階段状に進むわけではありません。</p>'}}
$('#levelMenu').onclick=()=>showModal('levels');$('#secretBtn').onclick=()=>showModal('secret');$('#modalClose').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};
function hintPath(){const init={...clone(state)},q=[init],seen=new Map();const key=s=>[s.a.x,s.a.y,s.b.x,s.b.y,s.pa,s.pb].join(',');seen.set(key(init),'');for(let qi=0;qi<q.length;qi++){const s=q[qi],path=seen.get(key(s));if(solved(s))return path;for(const d of 'URDL'){let r=simulate(s,d).s,k=key(r);if(!seen.has(k)){seen.set(k,path+d);q.push(r)}}}return null}
window.__TWIN_DEBUG={get:()=>({level:levelIndex,moveCount,clockA,clockB,state:clone(state),won,levels:levels.length,goalA:lv.ga,goalB:lv.gb,slowA:isSlow(state.a),slowB:isSlow(state.b)}),go:i=>loadLevel(i),move:applyMove,hint:hintPath,levels:levels.map((l,i)=>({i,name:l.name,map:l.map}))};
